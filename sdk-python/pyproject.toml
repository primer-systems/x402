[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "primer-x402"
version = "1.0.0"
description = "Primer ecosystem toolkit for x402"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Primer Systems", email = "dev@primer.systems" }
]
keywords = ["x402", "primer", "payments", "micropayments", "chutes", "ai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "x402>=2.0.0",
    "web3>=6.0.0",
    "eth_account>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://primer.systems"
Documentation = "https://docs.primer.systems"
Repository = "https://github.com/primersystems/x402"

[project.scripts]
primer-x402 = "primer_x402.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/primer_x402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/primer_x402"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
